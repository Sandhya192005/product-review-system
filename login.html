<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review System - Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container auth-container">
        <header class="app-header">
            <h1>Product Review System</h1>
            <p class="subtitle">Sign in to browse and add product reviews</p>
        </header>

        <section class="auth-section">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Log In</button>
                <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <form id="login-form" class="auth-form">
                <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
                <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                <p class="auth-error" id="login-error"></p>
                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <form id="signup-form" class="auth-form hidden">
                <input type="text" id="signup-username" placeholder="Choose a username" required autocomplete="username">
                <input type="password" id="signup-password" placeholder="Choose a password (min 6 characters)" required autocomplete="new-password" minlength="6">
                <input type="password" id="signup-confirm" placeholder="Confirm password" required autocomplete="new-password">
                <p class="auth-error" id="signup-error"></p>
                <button type="submit" class="submit-btn">Sign Up</button>
            </form>
        </section>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (getSession()) {
                window.location.href = 'home.html';
                return;
            }

            const tabs = document.querySelectorAll('.auth-tab');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');

            tabs.forEach(function (tab) {
                tab.addEventListener('click', function () {
                    tabs.forEach(function (t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    const isLogin = tab.dataset.tab === 'login';
                    loginForm.classList.toggle('hidden', !isLogin);
                    signupForm.classList.toggle('hidden', isLogin);
                });
            });

            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = '';

                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value;

                const users = loadUsers();
                const hash = await hashPassword(password);
                const user = users.find(function (u) { return u.username.toLowerCase() === username.toLowerCase(); });

                if (!user || user.passwordHash !== hash) {
                    errorEl.textContent = 'Incorrect username or password.';
                    return;
                }

                setSession(user.username);
                window.location.href = 'home.html';
            });

            signupForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                const errorEl = document.getElementById('signup-error');
                errorEl.textContent = '';

                const username = document.getElementById('signup-username').value.trim();
                const password = document.getElementById('signup-password').value;
                const confirm = document.getElementById('signup-confirm').value;

                if (username.length < 3) {
                    errorEl.textContent = 'Username must be at least 3 characters.';
                    return;
                }
                if (password.length < 6) {
                    errorEl.textContent = 'Password must be at least 6 characters.';
                    return;
                }
                if (password !== confirm) {
                    errorEl.textContent = 'Passwords do not match.';
                    return;
                }

                const users = loadUsers();
                if (users.some(function (u) { return u.username.toLowerCase() === username.toLowerCase(); })) {
                    errorEl.textContent = 'That username is already taken.';
                    return;
                }

                const passwordHash = await hashPassword(password);
                users.push({ username: username, passwordHash: passwordHash });
                saveUsers(users);

                setSession(username);
                window.location.href = 'home.html';
            });
        });
    </script>
</body>
</html>
